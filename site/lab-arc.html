<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>弧排样品 v8</title>
<style>
  /* 独立样品页 · v8（用户圈红图定位的问题）
     问题：条按**弦**（直线）定位 → 与圆边（弧）之间留出**新月形空隙**（用户圈红的地方）
     修法：把条画成 **左边界就是圆盘那段弧** 的形状 → 空隙被填满
     文字**保持水平**（不跟着转）—— 放在形状是直的那一侧
     其余照旧：5 条聚焦窗、选中最大两端递减、两端模糊、整条完整不裁切 */
  html,body{margin:0;height:100%;background:#0a0b0d;
    font-family:"SF Pro Display",-apple-system,"Segoe UI",system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:260px;height:380px;display:flex;align-items:center;justify-content:center;}

  #dial{position:relative;width:152px;height:152px;border-radius:50%;
    /* 形状本来就卡在圆内（fitsAll 保证），这里只裁掉**模糊向外晕出**的那一点 */
    overflow:hidden;
    background:radial-gradient(circle at 50% 42%,rgba(255,255,255,.07),rgba(255,255,255,.015) 62%),
      rgba(18,19,22,.92);
    border:1px solid rgba(255,255,255,.10);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.05);}
  /* 图形层：坐标原点挪到圆心，SVG 尺寸 = 盘直径（viewBox -76..76） */
  #shapes{position:absolute;left:0;top:0;width:152px;height:152px;}
  .bar{transition:opacity 220ms ease;}

  #core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    text-align:center;pointer-events:none;opacity:.9;}
  #who{font-size:9.5px;color:rgba(255,255,255,.5);}

  #hint{position:absolute;bottom:10px;width:100%;text-align:center;
    font-size:11px;color:rgba(255,255,255,.30);}
</style>
</head>
<body>
<div id="stage">
  <div id="dial">
    <svg id="shapes" viewBox="-76 -76 152 152" aria-hidden="true"></svg>
    <div id="core"><div id="who">空闲</div></div>
  </div>
  <div id="hint">滚轮 / 上下键 转动 · 点一下直接选中</div>
</div>
<script>
const CATS = [
  { name: '工作', color: '#4F8CFF', dur: '2:15' },
  { name: '学习', color: '#9B6DFF', dur: '45m' },
  { name: '运动', color: '#2FBF71', dur: '20m' },
  { name: '生活', color: '#F2A93B', dur: '1:05' },
  { name: '阅读', color: '#23B8D5', dur: '35m' },
  { name: '写作', color: '#F06EAA', dur: '10m' },
  { name: '摸鱼', color: '#8a91a3', dur: '5m' },
]

const R = 76, SAFE = 4, LIMIT = R - SAFE   // 弧半径：条的左边界就是这条弧
const ROW_H = 28
const VISIBLE = 2

/* 三级递减 */
const LV = [
  { h: 30, nm: 12.5, du: 10.5, pad: 20, blur: 0,   op: 1,    named: true  },
  { h: 24, nm: 11,   du: 9,    pad: 16, blur: 0,   op: 0.94, named: true  },
  { h: 18, nm: 10,   du: 8.5,  pad: 12, blur: 1.2, op: 0.66, named: false },
]

let sel = 0
/* ★ offset 是**不取模**的连续位置：滚动时它单调地加减，
   于是每个分类的 d = i - offset 也**连续变化** —— 条只会朝一个方向走，
   一条"从一边进来、另一边出去"，绝不会横穿整个盘（用户报的"堆到一起"就是这个）。
   旧的写法是 d = i - sel 再取模，快速滚动时条会被重新分到对面 → 只能穿过中心滑过去。 */
let offset = 0
const svg = document.getElementById('shapes')

function inkFor(hex) {
  const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(String(hex || ''))
  if (!m) return '#fff'
  const L = (0.299 * parseInt(m[1], 16) + 0.587 * parseInt(m[2], 16) + 0.114 * parseInt(m[3], 16)) / 255
  return L > 0.62 ? 'rgba(12,14,18,.92)' : 'rgba(255,255,255,.97)'
}
/* 圆上横坐标：x = -√(LIMIT² - y²)，y 越靠外 |x| 越小 */
const xAt = (y) => -Math.sqrt(Math.max(0.01, LIMIT * LIMIT - y * y))

/* 条的形状：**普通胶囊**（两端圆头）—— 回到用户认可的 v5 形态。
   "左边贴弧、随滚动形变"已放弃：152px 下"两边都弯 + 横向装下文字"数学上不成立
   （内弧半径会小到 8px，等于直线）。详见 docs/弧排交互-问题简报.md
   位置：左端按**这一行最靠外的那条边**取弦位（不能按中心 y，否则上下角出圆、宽度被迫砍没） */
function capsulePath(yT, yB, xL, xR) {
  const r = Math.min((yB - yT) / 2, (xR - xL) / 2)
  return [
    `M ${(xL + r).toFixed(2)} ${yT.toFixed(2)}`,
    `L ${(xR - r).toFixed(2)} ${yT.toFixed(2)}`,
    `A ${r.toFixed(2)} ${r.toFixed(2)} 0 0 1 ${(xR - r).toFixed(2)} ${yB.toFixed(2)}`,
    `L ${(xL + r).toFixed(2)} ${yB.toFixed(2)}`,
    `A ${r.toFixed(2)} ${r.toFixed(2)} 0 0 1 ${(xL + r).toFixed(2)} ${yT.toFixed(2)}`,
    'Z',
  ].join(' ')
}
/* 四个角都在圆内才允许（整条完整可见，不做裁切） */
function fitsAll(x, yT, yB, w) {
  const pts = [[x, yT], [x + w, yT], [x, yB], [x + w, yB]]
  return pts.every((p) => p[0] * p[0] + p[1] * p[1] <= LIMIT * LIMIT)
}

/* 常驻 5 个 <g>，**不再每次清空重建** —— 清空会把元素连同过渡一起扔掉
   （用户报"动效怎么不见了"就是这个原因）。
     位置：靠 transform 过渡 → 平滑滑动
     形状：左右边界的 d 每次重算 → **形状本身随滚动连续变化**（这才是"形变"） */
const POOL = []
/* 槽位绑定**分类下标**（而不是"当前可见的第 k 个"）——
   这样每条永远用同一个 <g>，位置连续变化，不会因为顺序变化而重新分配。
   数量 = 分类数：lab 里分类是固定的，够用；真实组件里改成按需扩容即可。 */
for (let i = 0; i < CATS.length; i++) {
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g')
  g.style.transition = 'transform 300ms cubic-bezier(.22,1,.36,1), opacity 220ms ease'
  g.style.willChange = 'transform, opacity'
  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path')
  const t1 = document.createElementNS('http://www.w3.org/2000/svg', 'text')
  const t2 = document.createElementNS('http://www.w3.org/2000/svg', 'text')
  t1.setAttribute('dominant-baseline', 'central')
  t2.setAttribute('dominant-baseline', 'central')
  t2.setAttribute('text-anchor', 'end')
  t2.setAttribute('opacity', '0.78')
  g.appendChild(path); g.appendChild(t1); g.appendChild(t2)
  svg.appendChild(g)
  POOL.push({ g, path, t1, t2 })
}

function render() {
  const n = CATS.length
  for (let i = 0; i < n; i++) {
    const slot = POOL[i]
    /* ★ d 归到最近的那个"等价位置"，落在 [-n/2, n/2)。
       上一轮我直接用了 i-offset（完全不取模）→ 滚到末尾就没有分类可显示了
       （用户看到"只剩一两条"甚至"全空"）。
       这里保留有界性，但**跳变点落在 |d|=n/2**，而 n/2=3.5 > VISIBLE=2
       → 跳变发生在看不见的地方，所以观感依然连续。 */
    let d = i - offset
    d = d - n * Math.round(d / n)
    const a = Math.abs(d)
    if (a > VISIBLE + 0.5) {
      /* ⚠️ 隐藏时必须**关掉过渡并直接归位**：
         它的位置此刻从 +n/2 跳到 -n/2，若还播动画就会横穿整个盘、
         从别的条身上碾过去 —— 那是"堆到一起"的另一半原因。 */
      slot.g.style.display = 'none'
      slot.g.style.transition = 'none'
      slot.g.style.transform = 'translate(0, ' + (d * ROW_H).toFixed(2) + 'px)'
      continue
    }
    if (slot.g.style.transition === 'none') {
      slot.g.style.transition = 'transform 300ms cubic-bezier(.22,1,.36,1), opacity 220ms ease'
    }
    slot.g.style.display = ''
    const c = CATS[i]
    const lv = LV[Math.min(2, Math.round(a))] || LV[2]
    const yc = d * ROW_H
    const yT = yc - lv.h / 2, yB = yc + lv.h / 2

    const bv = lv.blur ? 'blur(' + lv.blur + 'px)' : ''
    if (slot._b !== bv) { slot.g.setAttribute('filter', bv); slot._b = bv }
    slot.g.setAttribute('opacity', String(lv.op))
    slot.g.style.transform = 'translate(0, ' + yc.toFixed(2) + 'px)'

    const wName = lv.named ? c.name.length * lv.nm + 6 : 0
    const wDur = lv.named ? c.dur.length * lv.du * 0.62 + 4 : 0
    const wantW = lv.named ? (wName + wDur + lv.pad) : 26
    const yOuter = Math.max(Math.abs(yT), Math.abs(yB))
    const half = Math.sqrt(Math.max(0, LIMIT * LIMIT - yOuter * yOuter))
    const xL = -half
    let w = wantW
    while (w > 16 && !fitsAll(xL, yT, yB, w)) w -= 1

    const dstr = capsulePath(yT - yc, yB - yc, xL, xL + w)
    if (slot._d !== dstr) { slot.path.setAttribute('d', dstr); slot._d = dstr }
    if (slot._f !== c.color) { slot.path.setAttribute('fill', c.color); slot._f = c.color }
    const st = Math.round(a) === 0 ? 'rgba(255,255,255,.34)' : 'none'
    if (slot._s !== st) {
      slot.path.setAttribute('stroke', st)
      slot.path.setAttribute('stroke-width', st === 'none' ? '0' : '1.5')
      slot._s = st
    }
    slot.path.style.cursor = 'pointer'
    slot.path.onclick = () => { offset = i; render() }

    const ink = inkFor(c.color)
    if (lv.named) {
      slot.t1.style.display = ''; slot.t2.style.display = ''
      slot.t1.setAttribute('x', (xL + 9).toFixed(2)); slot.t1.setAttribute('y', '0')
      slot.t1.setAttribute('font-size', lv.nm); slot.t1.setAttribute('font-weight', '600')
      slot.t1.setAttribute('fill', ink); slot.t1.textContent = c.name
      slot.t2.setAttribute('x', (xL + w - 9).toFixed(2)); slot.t2.setAttribute('y', '0')
      slot.t2.setAttribute('font-size', lv.du); slot.t2.setAttribute('font-weight', '500')
      slot.t2.setAttribute('fill', ink); slot.t2.textContent = c.dur
    } else {
      slot.t1.style.display = 'none'; slot.t2.style.display = 'none'
    }
  }
  document.getElementById('who').textContent = '当前 · ' + CATS[((offset % n) + n) % n].name
}

let acc = 0
const MAX_STEPS = 4
window.addEventListener('wheel', (e) => {
  e.preventDefault()
  acc += e.deltaY
  const dir = Math.sign(acc)
  const steps = Math.floor(Math.abs(acc) / 100)
  if (steps < 1) return
  acc -= dir * steps * 100
  const k = Math.min(steps, MAX_STEPS)
  for (let i = 0; i < k; i++) offset += dir
  render()
}, { passive: false })
window.addEventListener('keydown', (e) => {
  if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return
  offset += (e.key === 'ArrowDown' ? 1 : -1)
  render()
})
render()
</script>
</body>
</html>
